server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  redis:
    host: ${REDIS_HOST:192.168.126.128}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:192.168.126.128:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: hmdp-voucher-order
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
app:
  instance-id: ${APP_INSTANCE_ID:1}
  order:
    close-timeout-minutes: ${ORDER_CLOSE_TIMEOUT_MINUTES:15}
    close-scan-delay-ms: ${ORDER_CLOSE_SCAN_DELAY_MS:30000}
    close-batch-size: ${ORDER_CLOSE_BATCH_SIZE:100}
  kafka:
    voucher-order-topic: hmdp.voucher-order.created
    voucher-order-dlt-topic: hmdp.voucher-order.created.DLT
    shop-cache-invalidation-topic: hmdp.shop.cache-invalidation
    shop-cache-invalidation-dlt-topic: hmdp.shop.cache-invalidation.DLT
    send-timeout-seconds: 5
    retry-interval-ms: 1000
    retry-count: 2
