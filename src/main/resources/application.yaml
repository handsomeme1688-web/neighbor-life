server:
  port: 8081
spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 4
  application:
    name: neighbor-life
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  redis:
    database: ${REDIS_DATABASE:0}
    host: ${REDIS_HOST:192.168.126.128}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 3s
    connect-timeout: 3s
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        max-wait: 1s
        time-between-eviction-runs: 10s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:192.168.126.128:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: hmdp-voucher-order
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
  level:
    com.hmdp: debug
info:
  app:
    name: neighbor-life
    payment-mode: ${app.payment.mode}
    sms-mode: ${app.sms.mode}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  sms:
    mode: ${SMS_MODE:disabled}
    access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
    access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
    sign-name: ${ALIYUN_SMS_SIGN_NAME:}
    template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
  payment:
    mode: ${PAYMENT_MODE:disabled}
    app-id: ${WECHAT_APP_ID:}
    merchant-id: ${WECHAT_MERCHANT_ID:}
    private-key-path: ${WECHAT_PRIVATE_KEY_PATH:}
    merchant-serial: ${WECHAT_MERCHANT_SERIAL:}
    public-key-path: ${WECHAT_PUBLIC_KEY_PATH:}
    public-key-id: ${WECHAT_PUBLIC_KEY_ID:}
    api-v3-key: ${WECHAT_API_V3_KEY:}
    notify-url: ${WECHAT_NOTIFY_URL:}
  business-zone: ${BUSINESS_TIME_ZONE:Asia/Shanghai}
  instance-id: ${APP_INSTANCE_ID:${random.uuid}}
  security:
    admin-user-ids: ${ADMIN_USER_IDS:}
  upload:
    directory: ${UPLOAD_DIRECTORY:./uploads}
  cache:
    shop-local-max-size: ${SHOP_LOCAL_CACHE_MAX_SIZE:1000}
    shop-local-ttl-seconds: ${SHOP_LOCAL_CACHE_TTL_SECONDS:60}
    invalidation-delay-ms: ${CACHE_INVALIDATION_DELAY_MS:500}
  order:
    demo-payment-enabled: ${DEMO_PAYMENT_ENABLED:false}
    close-timeout-minutes: ${ORDER_CLOSE_TIMEOUT_MINUTES:15}
    close-scan-delay-ms: ${ORDER_CLOSE_SCAN_DELAY_MS:30000}
    close-batch-size: ${ORDER_CLOSE_BATCH_SIZE:100}
  kafka:
    voucher-order-topic: hmdp.voucher-order.created
    voucher-order-dlt-topic: hmdp.voucher-order.created.DLT
    shop-cache-invalidation-topic: hmdp.shop.cache-invalidation
    shop-cache-invalidation-dlt-topic: hmdp.shop.cache-invalidation.DLT
    send-timeout-seconds: 5
    retry-interval-ms: 1000
    retry-count: 2
