global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: neighbor-life
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: [neighbor-life:8081]
  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]
